[package]
name = "tokenstab"
version = "0.1.3"
description = "TokensTab — Higgsfield credit calculator"
edition = "2021"

[lib]
name = "tokenstab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
