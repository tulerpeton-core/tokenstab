<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>TokensTab UI check</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#E9F0EE}#root{width:420px;height:800px}</style></head>
<body><div id="root"></div>
<script type="module">
// Drives the real UI like a user: add an image item, save, open the receipt.
localStorage.clear();
await import('/src/main.js');
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const btn = (pred) => [...document.querySelectorAll('button')].find(pred);
const log = [];
try {
  await wait(800);
  btn(b => b.getAttribute('aria-label') === 'Добавить позицию').click(); await wait(500);
  btn(b => b.getAttribute('role') === 'tab' && b.textContent.trim() === 'Фото').click(); await wait(300);
  btn(b => b.getAttribute('role') === 'radio' && /GPT Image 2(?!\.)/.test(b.textContent)).click(); await wait(300);
  btn(b => b.textContent.trim().startsWith('4K')).click(); await wait(200);
  btn(b => b.textContent.trim().startsWith('Medium')).click(); await wait(200);
  log.push('sheet line: ' + document.body.innerText.match(/[\d,]+ кр × \d+ = [\d,]+ кр/));
  btn(b => /Добавить в расчёт/.test(b.textContent)).click(); await wait(600);
  log.push('rows: ' + document.querySelectorAll('li').length);
  btn(b => /Сохранить расчёт/.test(b.textContent)).click(); await wait(2500);
  log.push('receipt: ' + (document.body.innerText.match(/К ОПЛАТЕ|К оплате/i) ? 'shown' : 'missing'));
  log.push('saved: ' + (JSON.parse(localStorage.getItem('tokenstab.v1') || '{}').saved || []).length);
} catch (e) { log.push('ERR ' + e.message); }
document.title = 'CHECK ' + log.join(' | ');
</script></body></html>
