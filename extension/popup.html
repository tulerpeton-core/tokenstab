<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TokensTab Collector</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="wrap">
<header class="head">
<img src="icons/128.png" alt="" width="26" height="26">
<span class="brand"><b>TokensTab Collector</b><small id="sub"></small></span>
</header>
<section class="card checks">
<div class="row" id="rowApp"><span class="dot" aria-hidden="true"></span><span><b></b><small></small></span></div>
<div class="row" id="rowTab"><span class="dot" aria-hidden="true"></span><span><b></b><small></small></span></div>
<div class="row" id="rowLast"><span class="dot ok" aria-hidden="true">✓</span><span><b></b><small></small></span></div>
</section>
<section class="card main">
<h1 id="title"></h1>
<p id="text"></p>
<div id="prog" hidden>
<div class="progline"><span id="progLabel"></span><b id="progPct"></b></div>
<div class="bar" aria-hidden="true"><span id="progBar"></span></div>
</div>
<p class="warn" id="warn" hidden></p>
<div class="btns">
<button id="primary" class="primary" type="button"></button>
<button id="secondary" class="secondary" type="button" hidden></button>
</div>
</section>
<p class="foot" id="foot"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
